<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Assistente IA — Codex CLI and Claude Code Workspace</title>
  <desc id="desc">A project panel launches Codex CLI or Claude Code in your terminal. Both agents share project notes.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#091527"/>
      <stop offset="1" stop-color="#12294a"/>
    </linearGradient>
    <linearGradient id="icon" x2="1" y2="1">
      <stop stop-color="#74c8ff"/>
      <stop offset="1" stop-color="#3578ff"/>
    </linearGradient>
    <pattern id="grid" width="31" height="31" patternUnits="userSpaceOnUse">
      <path d="M31 0H0V31" fill="none" stroke="#82b8ff" opacity=".09"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="26" fill="url(#bg)"/>
  <path d="M710 0h544a26 26 0 0 1 26 26v368a26 26 0 0 1-26 26H710z" fill="url(#grid)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
