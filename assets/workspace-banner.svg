    <path d="m74 80 10 10-10 10m16 0h13" fill="none" stroke="#071529" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="197" fill="#f6faff" font-size="72" font-weight="700" letter-spacing="-2">Assistente IA</text>
    <text x="58" y="250" fill="#cbdcf1" font-size="33" font-weight="500">Codex CLI &amp; Claude Code Workspace</text>
    <text x="58" y="348" fill="#92bcf4" font-size="22">macOS  ·  Linux  ·  Windows</text>
    <rect x="779" y="71" width="431" height="277" rx="21" fill="#101e32" stroke="#335779" stroke-width="2"/>
    <path d="M779 124h431" stroke="#294968"/>
    <circle cx="805" cy="98" r="5" fill="#ff8c8d"/>
    <circle cx="823" cy="98" r="5" fill="#ffcf82"/>
    <circle cx="841" cy="98" r="5" fill="#75dda8"/>
    <text x="808" y="169" font-size="20" fill="#a6caff">Project folder</text>
    <path d="M817 192v79m-1-60h22m-22 58h22" fill="none" stroke="#4f8fd6" stroke-width="2.5" stroke-linecap="round"/>
